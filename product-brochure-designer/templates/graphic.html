<!DOCTYPE html>
<!-- Technical example: replace the composition and content for each brief.
     Default canvas is 1080×1440 CSS px. Update both :root dimensions and @page.
     Capture section.page itself after fonts and images load; verify exported PNG pixels. -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{作品标题}}</title>
<style>
:root {
  --canvas-width: 1080px; --canvas-height: 1440px;
  --bg: #f4f0e7; --ink: #171a22; --accent: #2343df;
  --font-title: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-body: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: var(--font-body); }
.page { width: var(--canvas-width); height: var(--canvas-height); background: var(--bg); color: var(--ink); position: relative; overflow: hidden; padding: 80px; display: flex; flex-direction: column; }
.eyebrow { font-size: 24px; letter-spacing: 3px; }
h1 { font-family: var(--font-title); font-size: 120px; line-height: 1.08; letter-spacing: -5px; margin: auto 0 36px; max-width: 900px; }
.subtitle { font-size: 34px; line-height: 1.6; max-width: 820px; margin: 0 0 auto; }
.details { border-top: 2px solid currentColor; padding-top: 30px; font-size: 27px; line-height: 1.6; display: flex; justify-content: space-between; gap: 40px; }
.action { color: var(--accent); }
@page { size: 1080px 1440px; margin: 0; }
@media print { body { background: none; } * { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
</style>
</head>
<body>
<section class="page page-graphic">
  <div class="eyebrow">{{类别或品牌}}</div>
  <h1>{{主标题}}</h1>
  <p class="subtitle">{{辅助信息}}</p>
  <div class="details"><div>{{必要细节}}</div><div class="action">{{行动信息}}</div></div>
</section>
</body>
</html>
